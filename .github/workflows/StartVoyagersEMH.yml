name: Activate the EMH
on:
  workflow_dispatch:
  schedule:
    - cron: "0 */12 * * *"

jobs:
  start-conversation:
    name: Start Conversation
    runs-on: ubuntu-latest
    steps:
      - name: 🔧 I'm a doctor, not an engineer.
        uses: actions/checkout@v4
      - name: 🐍 I'm a doctor, not a zookeeper.
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: 📦 I'm a doctor, not a database.
        run: |
          python -m pip install -r requirements.txt
      - name: 🥼 Please state the nature of the medical emergency!
        env:
          MONGODB_CONNECTION_STRING: ${{secrets.MONGODB_CONNECTION_STRING}}
          REDDIT_PASSWORD: ${{secrets.REDDIT_PASSWORD}}
          CLIENT_ID: ${{secrets.CLIENT_ID}}
          CLIENT_SECRET: ${{secrets.CLIENT_SECRET}}
        run: |
          python src/startConversation.py
  looking-for-quotes:
    name: Looking for quotes
    runs-on: ubuntu-latest
    steps:
      - name: 🔧 I'm a doctor, not an engineer.
        uses: actions/checkout@v4
      - name: 🐍 I'm a doctor, not a zookeeper.
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: 📦 I'm a doctor, not a database.
        run: |
          python -m pip install -r requirements.txt
      - name: 🥼 Please state the nature of the medical emergency!
        env:
          MONGODB_CONNECTION_STRING: ${{secrets.MONGODB_CONNECTION_STRING}}
          REDDIT_PASSWORD: ${{secrets.REDDIT_PASSWORD}}
          CLIENT_ID: ${{secrets.CLIENT_ID}}
          CLIENT_SECRET: ${{secrets.CLIENT_SECRET}}
        run: |
          python src/startLookingForMoreQuotes.py
